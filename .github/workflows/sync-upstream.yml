name: Sync upstream

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch upstream and fork refs
        run: |
          git remote add upstream https://github.com/motis-project/motis.git || true
          git fetch origin master patches
          git fetch upstream master

      - name: Compute divergence
        id: divergence
        run: |
          MASTER_BEHIND=$(git rev-list --count origin/master..upstream/master)
          MASTER_AHEAD=$(git rev-list --count upstream/master..origin/master)
          PATCHES_BEHIND=$(git rev-list --count origin/patches..upstream/master)
          PATCHES_AHEAD=$(git rev-list --count upstream/master..origin/patches)
          echo "master_behind=$MASTER_BEHIND" >> "$GITHUB_OUTPUT"
          echo "master_ahead=$MASTER_AHEAD" >> "$GITHUB_OUTPUT"
          echo "patches_behind=$PATCHES_BEHIND" >> "$GITHUB_OUTPUT"
          echo "patches_ahead=$PATCHES_AHEAD" >> "$GITHUB_OUTPUT"

      - name: Open or refresh sync issue
        if: steps.divergence.outputs.master_behind != '0' || steps.divergence.outputs.patches_behind != '0'
        run: |
          BODY=$(cat <<EOF
          Upstream MOTIS moved ahead of the fork.

          Current divergence:
          - \`master\`: behind ${MASTER_BEHIND}, ahead ${MASTER_AHEAD}
          - \`patches\`: behind ${PATCHES_BEHIND}, ahead ${PATCHES_AHEAD}

          Expected maintenance flow:
          1. Refresh local \`master\` from \`upstream/master\`.
          2. Rebuild \`patches-next\` from refreshed \`master\`.
          3. Reapply only the still-required fork patches listed in \`docs/fork-patches.md\`.
          4. Validate \`patches-next\` before promoting it to \`patches\`.

          Do not auto-rebase \`patches\` onto upstream.
          EOF
          )

          EXISTING=$(gh issue list --state open --search "Upstream MOTIS sync needed in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "Upstream MOTIS sync needed" \
              --body "$BODY" \
              --label "maintenance"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MASTER_BEHIND: ${{ steps.divergence.outputs.master_behind }}
          MASTER_AHEAD: ${{ steps.divergence.outputs.master_ahead }}
          PATCHES_BEHIND: ${{ steps.divergence.outputs.patches_behind }}
          PATCHES_AHEAD: ${{ steps.divergence.outputs.patches_ahead }}
