name: GPU Validation

on:
  push:
    branches: [ master, gouda ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  gpu-validate:
    runs-on: [ self-hosted, linux, x64, gpu ]
    env:
      DEBIAN_FRONTEND: noninteractive
      BUILDCACHE_COMPRESS: true
      BUILDCACHE_DIRECT_MODE: true
      BUILDCACHE_ACCURACY: SLOPPY
      BUILDCACHE_MAX_CACHE_SIZE: 5368709120
      CUDACXX: /usr/local/cuda/bin/nvcc
      CLICOLOR_FORCE: 1
      LD_LIBRARY_PATH: /usr/local/cuda/lib64
    steps:
      - uses: actions/checkout@v4

      - name: Get deps
        run: mkdir -p ~/deps && mv ~/deps .

      - name: Configure
        run: |
          cmake --preset cuda
          cmake --preset cpu

      - name: Build
        run: |
          ./build/cuda/buildcache/bin/buildcache -z
          cmake --build --preset cuda --target motis nigiri-test
          cmake --build --preset cpu  --target motis
          ./build/cuda/buildcache/bin/buildcache -s

      - name: nigiri-test
        run: ./build/cuda/deps/nigiri/nigiri-test

      - name: Save deps
        if: always()
        run: mv deps ~

      - name: Import Germany
        run: |
          cd "$HOME/ci-data/ger"
          "$GITHUB_WORKSPACE/build/cpu/motis" import -c config_de.yml -d data

      - name: Import Europe
        run: |
          cd "$HOME/ci-data/eu"
          "$GITHUB_WORKSPACE/build/cpu/motis" import -c config_europe.yml -d data

      - name: Import Switzerland
        run: |
          cd "$HOME/ci-data/ch"
          "$GITHUB_WORKSPACE/build/cpu/motis" import -c config_ch.yml -d data

      - name: Validate Germany
        run: |
          python3 tools/validate.py ./build/cpu/motis ./build/cuda/motis \
            --data "$HOME/ci-data/ger/data" \
            --name germany \
            --date 2026-07-10 \
            --intermodal \
            --routed-footpaths \
            --tts \
            --exclude-transit-modes HIGHSPEED_RAIL \
            --n 20

      - name: Validate Europe
        run: |
          python3 tools/validate.py ./build/cpu/motis ./build/cuda/motis \
            --data "$HOME/ci-data/eu/data" \
            --name europe \
            --date 2026-07-24 \
            --rt-dir "$HOME/ci-data/eu" \
            --intermodal \
            --routed-footpaths \
            --flex \
            --bike \
            --tts \
            --exclude-transit-modes COACH \
            --n 20 \
            --n_threads 8

      - name: Validate Europe RENTAL
        run: |
          python3 tools/validate.py ./build/cpu/motis ./build/cuda/motis \
            --data "$HOME/ci-data/eu/data-rental" \
            --gbfs-dir "$HOME/ci-data/eu" \
            --rt-dir "$HOME/ci-data/eu" \
            --name europe-rental \
            --date 2026-07-24 \
            --intermodal \
            --rental \
            --bounds '{"type":"Polygon","coordinates":[[[1.4461,48.1200],[3.5599,48.1200],[3.5599,49.2415],[1.4461,49.2415],[1.4461,48.1200]]]}' \
            --n 20 \
            --n_threads 8

      - name: Validate Switzerland ODM
        run: |
          python3 tools/validate.py ./build/cpu/motis ./build/cuda/motis \
            --data "$HOME/ci-data/ch/data" \
            --name switzerland \
            --date 2026-07-06 \
            --flex \
            --n 1000
